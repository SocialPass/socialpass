[build]
  # Alternative approach if apt-get is not allowed
  command = """
    # Install plugin dependencies
    cd netlify/plugins/django-optimize && npm install && cd ../../../
    # Install Python dependencies
    pip install --upgrade pip setuptools wheel
    pip install -r netlify-requirements.txt
    # Collect static files with build-specific settings
    DJANGO_SETTINGS_MODULE=config.settings.build python manage.py collectstatic --noinput
  """
  publish = "staticfiles"
  functions = "netlify/functions"
  # Use a custom build image that includes PostgreSQL libraries and Python 3.11 support
  image = "netlify/build:jammy"

[build.environment]
  PYTHON_VERSION = "3.11"
  DJANGO_SETTINGS_MODULE = "config.settings.netlify"
  # Add this to prevent Python from writing bytecode files
  PYTHONDONTWRITEBYTECODE = "1"
  # Add this to configure Python to handle unbuffered output
  PYTHONUNBUFFERED = "1"
  # Enable Netlify's asset optimization
  NETLIFY_USE_BUNDLING = "true"
  NETLIFY_USE_MINIFICATION = "true"

# Redirects are now in the _redirects file for better performance
# But we'll keep this as a fallback
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/django"
  status = 200

# Enable asset optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Add Brotli compression for better performance
[[headers]]
  for = "/*"
    [headers.values]
    Content-Encoding = "br"

# Configure different contexts for different deployment environments
[context.production]
  environment = { DEBUG = "false" }

[context.branch-deploy]
  environment = { DEBUG = "true" }

[context.deploy-preview]
  environment = { DEBUG = "true" }

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Add more useful plugins
[[plugins]]
  package = "netlify-plugin-inline-critical-css"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    # Replace performance_budget with thresholds
    thresholds = { performance = 0.8, accessibility = 0.9, best-practices = 0.9, seo = 0.9 }
    output_path = "reports/lighthouse.html"

# Add our custom Django optimization plugin
[[plugins]]
  package = "./netlify/plugins/django-optimize"

[dev]
  # Django is not in Netlify's supported framework list
  # Use a generic command instead
  command = "python manage.py runserver"
  # Remove the framework setting
  # framework = "django" 